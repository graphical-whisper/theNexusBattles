steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pi2the-ia-server:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pi2the-ia-server:$COMMIT_SHA']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'pi2the-ia-server'
    - '--image'
    - 'gcr.io/$PROJECT_ID/pi2the-ia-server:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--set-env-vars'
    - 'INVENTORY_BASE_URL=http://localhost:9000,INVENTORY_TIMEOUT_SECS=5.0,HOST=0.0.0.0,PORT=8080'
    - '--memory'
    - '1Gi'
    - '--cpu'
    - '1'
    - '--min-instances'
    - '0'
    - '--max-instances'
    - '3'

images:
  - 'gcr.io/$PROJECT_ID/pi2the-ia-server:$COMMIT_SHA'