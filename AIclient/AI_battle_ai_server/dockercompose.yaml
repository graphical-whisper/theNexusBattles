version: '3.8'

services:
  ia-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - INVENTORY_BASE_URL=http://inventory:9000
      - INVENTORY_TIMEOUT_SECS=5.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Si necesitas el servicio de inventario
  inventory:
    image: your-inventory-image:latest
    ports:
      - "9000:9000"